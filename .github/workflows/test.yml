name: HTML Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          if [ -f index.html ]; then
            echo "index.html exists"
          else
            echo "index.html is missing"
            exit 1
          fi